---
layout: default
title: All Illustrations
---

<ul>
{% for item in site.illustrations %}
  <li>
    <a href="{{ item.url }}">
      {% if item.image %}
        <img 
          src="/assets/images/illustrations/thumbnail/{{ item.image }}-thumbnail.png" 
          alt="{{ item.title }} thumbnail"
          width="200"
        >
      {% endif %}
      <p>{{ item.title }}</p>
    </a>
  </li>
{% endfor %}
</ul>
