---
layout: default
pagination: 
  enabled: true
  collection: illustrations
---

<main class="main-content container">
  <h1 class="section-title">All Illustrations</h1>
  <h2 class="section-subtitle">{{ site.data.categories[page.autopage.display_name].en }}</h2>

  {% include category-nav.html %}

 <div class="illustration-grid">
    {% for item in paginator.posts %}
      <article class="illustration-card">
        <a href="{{ item.url }}" class="card-link">
          <div class="sample-area">
            <img src="/assets/images/illustrations/thumbnail/{{ item.image }}-thumbnail.png" alt="{{ item.title.en }} thumbnail - SunnyDraws">
          </div>
          <div class="info-area">
            <h3>{{ item.title.en }}</h3>
          </div>
        </a>
        
      <!--
        <div class="download-btn-area">

          <a href="/assets/images/illustrations/download/{{ item.image }}.png" 
            download="{{ item.image }}.png"
            class="basic-button"
            onclick="gtag('event', 'file_download', {
            'file_name': '{{ item.title.en | escape }}',
            'file_extension': 'png' 
        });">
            Download
          </a>
        </div>
        </div>
      -->
        
      </article>
    {% endfor %}
  </div>

  {% include paginator.html %}

</main>
