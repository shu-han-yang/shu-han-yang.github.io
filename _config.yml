site_title: Sunny Draws
site_tagline: Free illustration PNG download


plugins:
  - jekyll-paginate-v2

collections:
  illustrations:
    output: true
    permalink: /illustrations/:categories/:name/


# 分頁插件設定(使用 jekyll-paginate-v2 插件）
pagination:
  enabled: true
  collection: 'illustrations'
  per_page: 20
  permalink: '/illustrations/page/:num/' # 這是「總覽分頁」的網址
  #indexpage: 'illustrations' # 👈 強制指定分頁的「主角」是 illustrations
  #extension: 'html'           # 👈 強制副檔名，防止出現那個奇怪的 "- .html"
  sort_field: 'date'
  sort_reverse: true