<title>
{% if page.title == "Home" %}
  Sunny Draws - Free illustration PNG download
{% else %}
  {% assign category_en = site.data.categories[page.autopage.display_name].en %}
  {{ category_en | default: page.title.en }} | {{ site.site_title }} - {{ site.site_tagline }}
{% endif %}
</title>

<link rel="stylesheet" type="text/css" href="{{ '/stylesheet.css' | relative_url }}">

{% assign meta_description = page.description.en
  | default: page.description
  | default: site.description %}

{% if meta_description %}
<meta name="description" content="{{ meta_description | strip_html | strip_newlines | escape }}">
{% endif %}

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-L2H0C08CQV"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-L2H0C08CQV');
</script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Pinterest -->
<meta name="p:domain_verify" content="d21794ffd75e6d00ff9a9856aee6b8de"/>
